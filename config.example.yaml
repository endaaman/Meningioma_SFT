# config.example.yaml — このファイルを config.yaml にコピーして各パスを設定する
# cp config.example.yaml config.yaml

# ---- ラベル ----
label:
  site_a:
    label:   path/to/site_a/case_labels.csv
    subtype: path/to/site_a/case_subtypes.csv
    patient: path/to/site_a/case_patients.csv   # 任意。case_id,patient_id。無ければ 1 症例 = 1 患者（lp.py の val split に使う）
  site_b:
    label:   path/to/site_b/case_labels.csv
    subtype: path/to/site_b/case_subtypes.csv

# ---- 埋め込み ----
embedding:
  site_a:
    original:   path/to/site_a/embedding      # HDF5 ファイル群のディレクトリ
    centroid:   path/to/centroid/site_a       # centroid.py が書き出す先
    combat:     path/to/combat/site_a         # combat.py が書き出す先
    combat_cov: path/to/combat_cov/site_a     # combat.py --covariates subtype が書き出す先（組織型を共変量にした ComBat）
    affine_free:   path/to/affine/site_a_free     # affine.py が書き出す先
    affine_oracle: path/to/affine/site_a_oracle   # affine.py が書き出す先
    gan:        path/to/gan/site_a            # gan.py が書き出す先
    tile_model: conch15_768                   # wsi-toolbox のモデル名（HDF5 キーのプレフィックス）
  site_b:
    original:   path/to/site_b/embedding
    centroid:   path/to/centroid/site_b
    combat:     path/to/combat/site_b         # combat.py が書き出す先
    combat_cov: path/to/combat_cov/site_b     # combat.py --covariates subtype が書き出す先
    affine_free:   path/to/affine/site_b_free     # affine.py が書き出す先
    affine_oracle: path/to/affine/site_b_oracle   # affine.py が書き出す先
    gan:        path/to/gan/site_b
    macenko:    path/to/macenko/site_b      # macenko.py が書き出す先（色正規化、patho2 → EBRAINS の向き）
    tile_model: conch15_768

# ---- gan.py ----
gan:
  patch_size: 512   # cache/{patch_size}/gan/patches を参照
  batch_size: 512
  device:     auto  # cuda / cpu / auto
  overwrite:  false

# ---- macenko.py（色正規化。GAN と同じ向き: 対象施設 → reference。target は reference の全スライドから 1 つ）----
macenko:
  patch_size:        512    # cache/{patch_size}/patches を参照
  fit_patches:       16     # target 推定: reference のスライドごとに無作為に取るパッチ数
  fit_stride:        8      # target 推定: 画素の間引き
  seed:              42
  stride:            2      # パッチごとの染色ベクトル・濃度上限の推定に使う画素の間引き（変換は全画素）
  min_pixels:        1000   # 推定に使える画素（間引き後、OD >= beta）がこれ未満のパッチは元のまま
  chunk_size:        256    # h5 から一度に読むパッチ数
  norm_batch_size:   32
  encode_batch_size: 256
  num_workers:       6      # h5（gzip）の読み出し worker 数
  device:            auto
  overwrite:         false

# ---- titan.py ----
titan:
  device:    auto   # cuda / cpu / auto
  overwrite: false
  variants:  [original, gan]   # centroid はスライドレベル補正のため除外

# ---- HDF5 キー ----
# 完全キーは各スクリプトが以下のテンプレートで構築する:
#   gan_patches / gan_coords : cache/{gan.patch_size}/{key}
#   tile_features / tile_coords : {embedding.*.tile_model}/{key}
#   slide_feature : {embedding.*.tile_model}/{key}
keys:
  gan_patches:   "gan/patches"
  gan_coords:    "gan/coordinates"
  tile_features: "features"
  tile_coords:   "coordinates"
  slide_feature: "aggregates/titan/feature"

# ---- サブタイプ列の候補（CSV内を先頭から順に探す）----
subtype_cols: [subtype]

# ---- variants (umap / confusion_mtx / dendrogram の出力サブフォルダ) ----
# 表示名: embedding 内の dir キー
variants:
  original: original
  centroid: centroid
  combat:   combat
  combat_cov:    combat_cov   # 組織型を共変量にした ComBat（査読対応の参考。図表には出さない）
  affine_free:   affine_free
  affine_oracle: affine_oracle
  gan:      gan
  macenko:  macenko

# ---- 補正の基準データセット ----
# このデータセットは補正 variant でも常に original を使用する（reference 側）
reference: site_a

# ---- centroid.py ----
centroid:
  pca_n_components: 50   # PCA可視化前の事前削減次元 (null で生埋め込みをそのまま使用)
  overwrite: false        # true にすると既存の centroid HDF5 を上書き

# ---- affine.py ----
affine:
  min_n:     5      # affine_oracle の倍率を推定する組織型の最小例数（両施設）
  overwrite: true

# ---- combat.py ----
combat:
  covariates: []        # 共変量（例 [subtype]）。既定なし＝評価施設のラベルを使わない。--covariates で上書きできる
  covariate_variant: combat_cov   # 共変量ありのときの書き出し先 variant（embedding.*.combat_cov）。combat/ は触らない
  covariate_min_n:   0            # > 0 なら片方の施設でこの例数未満の組織型を共変量としてだけ "other" にまとめる（neuroCombat が落ちたときの逃げ道。0 = そのまま 17 水準）
  overwrite:  true

# ---- dendrogram_bootstrap.py（隣接ペア数の患者単位 bootstrap。条件は CONDITIONS_FIG3）----
dendrogram_bootstrap:
  n_boot: 1000
  seed:   42

# ---- umap_plot.py ----
umap:
  n_neighbors:  15
  min_dist:     0.01
  random_state: 42
  markers: ["o", "s", "^", "D", "v", "P", "X", "*"]

# ---- confusion_mtx.py / dendrogram.py ----
comparison:
  mmd: false   # true にすると MMD 行列も出力（時間がかかる）
  mmd_kernels: [linear, rbf, laplacian, poly, polynomial, sigmoid, cosine, additive_chi2, chi2]

# ---- 表示設定 ----
display:
  shortened:
    subtypes:                          # 凡例・軸ラベルに使う略称
      SFT:                             SFT
      Meningothelial meningioma:       Meni
      Fibrous meningioma:              Fibr
      Transitional meningioma:         Tran
      Psammomatous meningioma:         Psam
      Angiomatous meningioma:          Angi
      Microcystic meningioma:          Micr
      Secretory meningioma:            Secr
      Metaplastic meningioma:          Meta
      Chordoid meningioma:             Chor
      Rhabdoid meningioma:             Rhab
      Atypical meningioma:             Atyp
      Anaplastic meningioma:           Anap
      Lymphoplasmacyte-rich meningioma: Lymp
      Clear cell meningioma:           Clea
      Papillary meningioma:            Papi
      NOS meningioma:                  NOS
  markers:
    sources:
      site_a: "o"
      site_b: "s"
  colors:
    sft: "#000000"       # "sft" を含むサブタイプはすべて黒固定（大文字小文字不問）
    sources:
      site_a: "#4477AA"
      site_b: "#EE6677"
    subtypes:            # この順が凡例・UMAP・行列の表示順。未記載は tab20 で自動配色
      SFT:                               "#000000"
      Meningothelial meningioma:         "#1f77b4"
      Fibrous meningioma:                "#aec7e8"
      Transitional meningioma:           "#ff7f0e"
      Psammomatous meningioma:           "#ffbb78"
      Angiomatous meningioma:            "#2ca02c"
      Microcystic meningioma:            "#98df8a"
      Secretory meningioma:              "#8c564b"
      Metaplastic meningioma:            "#c49c94"
      Chordoid meningioma:               "#9467bd"
      Rhabdoid meningioma:               "#c5b0d5"
      Atypical meningioma:               "#d62728"
      Anaplastic meningioma:             "#ff9896"
      Lymphoplasmacyte-rich meningioma:  "#e377c2"
      Clear cell meningioma:             "#f7b6d2"
      Papillary meningioma:              "#7f7f7f"
      NOS meningioma:                    "#c7c7c7"

# ---- lp.py ----
lp:
  device:       auto   # cuda / cpu / auto
  max_epochs:   1000
  batch_size:   64
  lr:           1.0e-4
  weight_decay: 0.0
  dropout:      0.0
  num_workers:  0
  val_fraction: 0.3    # hold-out 割合（患者単位。実際は 1/round(1/val_fraction) ≒ 1/3）
  patience:     50     # early stopping patience (val_loss 基準)
  class_names:   {0: Meningioma, 1: SFT}
  variants:      [original, centroid, gan, combat]   # combat は比較検討用（本番図表の CONDITION_ORDER には入れない）
  evaluate_only: true   # true にすると訓練をスキップし既存 ckpt で評価のみ実行

# ---- lp.py --task histotype / histotype_labels.py（組織型の施設間分類、検討用）----
lp_histotype:
  classes:                 # 両施設に 5 例以上ある主要な組織型（並び = クラス番号）。SFT・Atypical/Anaplastic（grade）・希少型・NOS は除外
    - Meningothelial meningioma
    - Fibrous meningioma
    - Transitional meningioma
    - Psammomatous meningioma
    - Angiomatous meningioma
    - Microcystic meningioma
    - Secretory meningioma
  label_dir:     data/histotype          # histotype_labels.py が <site>/case_histotype_n*.csv を書く
  output_subdir: lp_histotype            # output_dir 配下（2 値の lp/ とは別）
  variants:      [original, gan, centroid, combat]

# クラス集合の変種（--set <name> で lp_histotype を上書き。histotype_labels.py / lp.py / lp_bootstrap.py / figs.histotype_preview）

# ---- nc.py（訓練不要の施設間分類＝最近傍重心法。Fig 5・Table S1・Fig S3・Table S2 の元）----
nc:
  variants:      [original, gan, macenko, combat, combat_cov, centroid, affine_free, affine_oracle]   # 本番図表は figs/ 側で CONDITIONS_FIG3 に絞る
  histotype_set: main                   # 組織型分類のクラス集合（lp_histotype_sets の名前）

lp_histotype_sets:
  main:                    # 主の版（暫定、6 クラス版と比べて ken 判断）: Transitional と Secretory を除く 5 クラス
    classes:               # Transitional: meningothelial と fibrous の混合型で、施設間の診断基準の不一致を距離解析で独立に確認
      - Meningothelial meningioma   # Secretory: patho2 が 6 例で、patho2 で学習する方向が成り立たない
      - Fibrous meningioma
      - Psammomatous meningioma
      - Angiomatous meningioma
      - Microcystic meningioma
    label_dir:      data/histotype_main
    output_subdir:  lp_histotype_main
    preview_prefix: histotype_main
  no_tran:                 # 比較用: Transitional だけ除く 6 クラス（Secretory を残す）
    classes:
      - Meningothelial meningioma
      - Fibrous meningioma
      - Psammomatous meningioma
      - Angiomatous meningioma
      - Microcystic meningioma
      - Secretory meningioma
    label_dir:      data/histotype_no_tran
    output_subdir:  lp_histotype_no_tran
    preview_prefix: histotype_no_tran

# ---- sft_distance_bar.py ----
sft_distance:
  variant:    centroid          # 補正後 variant を使用
  metric:     euc_mean          # 平均ベクトル間ユークリッド距離

# ---- shift_direction.py ----
shift_direction:
  variant: original   # 補正前の埋め込みで施設間シフトの向きを見る
  min_n:   5          # 両施設でこの例数以上のサブタイプだけ群にする
  n_perm:  1000       # 帰無（シャッフル / 例数を揃えた抽出）の回数
  seed:    42

# ---- shift_bio_axes.py（施設間シフト Δ の生物学的な軸（SFT−髄膜腫 / 組織型の組）に沿った成分と、共分散を考慮した帰無）----
shift_bio_axes:
  variant: original   # 補正前の埋め込み
  min_n:   5          # その施設にこの例数以上あるサブタイプだけ群にする（施設ごと。SFT も 1 群）
  n_null:  1000       # 共分散を考慮した無作為方向の本数
  n_perm:  1000       # ラベル並べ替え帰無の回数
  seed:    42
  top_k:   10         # 図・要約に出す組織型の組の数（|r| の大きい順）

# ---- shift_estimation.py（平行移動のシフト推定: 症例構成の切り分けと、推定に要る例数）----
shift_estimation:
  n_list:  [3, 5, 10, 20, 50, 100, 200]   # 対象施設から抜く例数（全例は自動で足す。単一組織型はその型の例数まで）
  n_draws: 200                            # 設定ごとの抽出回数（n が全例のときは 1 回）
  seed:    42
  n_jobs:  16                             # 評価の並列数（抽出は主プロセスで行うので結果は並列数によらない）
  min_n:   5                              # 組織型を合わせたシフト Δ* の群（両施設でこの例数以上）と、除去する生物学的方向の群（reference でこの例数以上）
  single_subtypes:                        # 単一組織型だけから抜く最悪ケース（対象施設で多い 3 型）
    - Fibrous meningioma
    - Meningothelial meningioma
    - Atypical meningioma

# ---- dataset.py（Table 1）----
dataset:
  demographics:            # 年齢・性別の CSV（EBRAINS annotation.csv 形式: uuid, pat_id, age, sex）。無い施設は書かない
    site_a: path/to/site_a/annotation.csv
    site_b: path/to/site_b/demographics.csv   # 同じ形式（uuid, pat_id, age, sex）。1 症例 = 1 患者なら uuid = pat_id = case_id でよい

# ---- harmonization.py ----
harmonization:
  variants: [original, centroid, gan, combat]   # 比較する状態（reference 施設は常に original）
  lisi_k:   30                          # LISI の近傍数
  site_null:                            # 施設ラベルの並べ替え検定（偶然のレベル）
    n_perm: 1000
    seed:   42
    nulls:  [within_subtype, free]      # within_subtype（サブタイプ内でシャッフル）が本文の基準

# ---- meanpool.py（平均プーリングのスライド埋め込み = TITAN の対照。Table S4・S5）----
meanpool:
  root:          data/{site}/meanpool      # {site} は embedding のキー。配下に original / gan / macenko / centroid / combat
  slide_feature: aggregates/mean/feature   # HDF5 キー（{tile_model}/ の下）
  variants:      [original, macenko, gan, combat, centroid]   # analyze で比べる条件（Table S5 の行）
  overwrite:     false                     # true にすると build が original / gan / macenko の平均を作り直す（centroid / combat は常に作り直す）

# ---- paper_figs.py ----
paper:
  version: v3   # 図表の出力先 output_dir/paper/{version}/。v1・v2 は凍結、v3 が現行

# ---- paper_patches.py（新 Fig 2 の代表パッチ候補）----
paper_patches:
  n_candidates: 5          # 施設×サブタイプごとの候補数（同一 WSI・同一患者からは 1 枚まで）
  min_n:        5          # 両施設でこの例数以上のサブタイプだけ候補を出す
  max_white_ratio: 0.10    # 白画素率（wsi-toolbox の ptp 法: RGB の max−min < 20）がこれを超えるパッチは選ばない
  wsi_index:               # パッチ画素が h5 に無いときに元 WSI を引くための索引
    patho2:  {csv: /mnt/server42/AI/Datasets/Meningioma_SFT/annotation.csv, id_col: case_id, path_col: wsi_path}
    ebrains: {csv: /mnt/server42/AI/Datasets/EBRAINS/annotation.csv, root: /mnt/server42/AI/Datasets/EBRAINS}

# ---- paper_color.py（新 Fig 2c の色の定量）----
paper_color:
  n_patches:  32           # スライドごとに無作為に取るパッチ数
  stride:     4            # 画素の間引き（計算量削減。4 なら 1/16）
  white_thr:  220          # R,G,B すべてがこの値を超える画素を背景として除外
  seed:       42

# ---- stain_response.py（埋め込みのシフト方向への射影と H/E 染色バランスのスライド単位の対応）----
stain_response:
  n_bins:        10   # 応答曲線の分位数（he_balance / H / E）
  min_n_subtype: 3    # 組織型内の残差化に使う組織型の最小例数（施設内）

# ---- held_out_case.py（コホートから除外して症例検討に使うスライド = ラベルが矛盾する患者。ラベル CSV からは既に除いてある）----
held_out:
  ebrains:
    - a19545d6               # pat_id 831: SFT 再発（N2140-15、28 歳、右脳神経）
    - a1965734               # pat_id 831: SFT 初発（N2296-14、27 歳）
    - a1967e5e               # pat_id 831: Atypical meningioma（N2586-14、27 歳、左前頭部）
  subtype:                   # 元の診断名を引く CSV（除外前のラベル。表示用）
    ebrains: data/ebrains/label/case_subtypes_n554.csv

# ---- stat6_case.py（patho2 の STAT6 免疫染色の有無・結果による記述統計。Supplementary 用）----
stat6:
  site:       patho2                                   # STAT6 の情報がある施設（補正される側）
  source:     /mnt/server42/AI/Datasets/Meningioma_SFT/__archive/all_cases_updated_n1721.csv   # 読み取り専用（NFS）。case_id, stat6_nuclear, stat6_cytoplasmic, vlm_class, original_diagnosis, findings
  status_csv: data/patho2/stat6_status.csv             # 書き出す先（Sync 側）。コホート（label.patho2.subtype）の症例だけ

# ---- 出力 ----
output_dir: ./output
# ---- titan_batch.py（EBRAINS 全体の CONCH 特徴 = EBRAINS_embeddings に TITAN を書き込む。グリオーマを先に、残りは名前順）----
ebrains_embeddings:
  root:       /mnt/server42/AI/Datasets/EBRAINS_embeddings   # <診断名>/<uuid>_hdf.h5。学生が wt extract --preset conch15 で作った特徴（conch15 と conch15_768、512 px / 0.5 mpp）。「1p/19q」は入れ子
  tile_model: conch15_768
  device:     auto
  log:        ebrains_embeddings/titan_log.csv              # output_dir 配下
  priority:                                                # 先に回す診断名ディレクトリ（WHO 2016 のびまん性グリオーマ）。順番どおり
    - "Glioblastoma, IDH-wildtype"
    - "Glioblastoma, IDH-mutant"
    - "Anaplastic astrocytoma, IDH-mutant"
    - "Anaplastic astrocytoma, IDH-wildtype"
    - "Diffuse astrocytoma, IDH-mutant"
    - "Diffuse astrocytoma, IDH-wildtype"
    - "Oligodendroglioma, IDH-mutant and 1p"                # 実体は …1p/19q codeleted/（入れ子）
    - "Anaplastic oligodendroglioma, IDH-mutant and 1p"
    - "Gemistocytic astrocytoma, IDH-mutant"
    - "Giant cell glioblastoma"
    - "Gliosarcoma"
    - "Diffuse midline glioma, H3 K27M-mutant"

# ---- patho2_gliomas_extract.py（院内グリオーマ Patho2Gliomas の HE から CONCH v1.5 + TITAN を作る）----
patho2_gliomas:
  wsi_root:   /mnt/server42/AI/Datasets/Patho2Gliomas             # <群>/<症例番号>/*.ndpi（旧 BrainTumor）
  out_root:   /mnt/server42/AI/Datasets/Patho2Gliomas_embeddings  # <群>/<症例番号>/<元ファイル名>.h5
  groups:     {A: ast, G: glm, O: odg, L: lym, M: met}            # ディレクトリ → ラベル略号（WSI_BT と同じ）。B は対象外
  priority:   [A, G, O, L, M]                                     # 処理順（グリオーマ 3 群 → リンパ腫 → 転移）
  preset:     conch15                                             # wsi-toolbox 0.7.0: 1 回の forward で cls（1024）と proj（768）を取る
  outputs:    [cls, proj]                                         # cls → conch15/features、proj → conch15_768/features（EBRAINS_embeddings と同じ構成）
  tile_model: conch15_768                                         # TITAN の入力グループ
  patch_size: 512
  target_mpp: 0.5
  batch_size: 256
  device:     auto
  override:   data/patho2_gliomas/representative_override.csv   # 任意。patho2_gliomas_select.py の手動上書き（case, file）。無ければ規則どおり
